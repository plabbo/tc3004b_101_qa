name: Run tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    container:
      image: node:20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: |
          apt-get update
          apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 \
            libxrandr2 libasound2 libpangocairo-1.0-0 libgtk-3-0 libgbm1 libdrm2
        shell: bash

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 120

      - run: |
          python3 -m http.server 8000 &
          sleep 10 &&
          curl http://localhost:8000

      - run: |
          npm install
          npm install mocha --save-dev
          chmod +x ./node_modules/.bin/mocha
          npx --no-install mocha tests/*.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
