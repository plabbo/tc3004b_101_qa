name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14.x'

    - name: Install Dependencies
      run: |
        npm install

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Get Chrome version
      run: |
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d'.' -f1,2)
        echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV

    - name: Install ChromeDriver
      run: |
        # Fetch the correct ChromeDriver version based on the Chrome version
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d'.' -f1,2)
        echo "CHROME_VERSION=$CHROME_VERSION"
        
        # Fetch the latest release compatible with this Chrome version
        CHROMEDRIVER_VERSION=$(curl -sS https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
        
        if [ -z "$CHROMEDRIVER_VERSION" ]; then
          echo "Could not find the matching ChromeDriver version for $CHROME_VERSION. Please check the version compatibility."
          exit 1
        fi
        
        echo "CHROMEDRIVER_VERSION=$CHROMEDRIVER_VERSION"
        wget https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/

    - name: Start HTTP server
      run: |
        python3 -m http.server 8000 &
        sleep 5
    
    - name: Run tests
      run: npx mocha tests/**/*.js
